<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="684px" preserveAspectRatio="none" style="width:1227px;height:684px;background:#FFFFFF;" version="1.1" viewBox="0 0 1227 684" width="1227px" zoomAndPan="magnify"><defs/><g><ellipse cx="385" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="750" x="11" y="50"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="289" x="23" y="110.5664"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="269" x="33" y="132.168">Set up Zephyr RTOS development environment</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="278" x="404.5" y="76"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="258" x="414.5" y="97.6016">Download and install Alire package manager</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="407" x="340" y="145.1328"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="387" x="350" y="166.7344">Download or Build the GNAT cross-toolchain for target architecture</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="750" x="11" y="199.2656"/><path d="M527,222.0215 L527,238.332 L507,242.332 L527,246.332 L527,262.6426 A0,0 0 0 0 527,262.6426 L960,262.6426 A0,0 0 0 0 960,262.6426 L960,232.0215 L950,222.0215 L527,222.0215 A0,0 0 0 0 527,222.0215 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M950,222.0215 L950,232.0215 L960,232.0215 L950,222.0215 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412" x="533" y="239.5898">- C main calls gnatbind-generated Ada package elaboration code</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222" x="533" y="254.9004">- C main calls Ada application APIs</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="244" x="263" y="225.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224" x="273" y="246.8672">Create a Zephyr C application skeleton</text><path d="M493.5,279.3984 L493.5,295.709 L473.5,299.709 L493.5,303.709 L493.5,320.0195 A0,0 0 0 0 493.5,320.0195 L853.5,320.0195 A0,0 0 0 0 853.5,320.0195 L853.5,289.3984 L843.5,279.3984 L493.5,279.3984 A0,0 0 0 0 493.5,279.3984 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M843.5,279.3984 L843.5,289.3984 L853.5,289.3984 L843.5,279.3984 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146" x="499.5" y="296.9668">- Application Ada code</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339" x="499.5" y="312.2773">- Minimal platform-indepdendent Ada runtime library</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177" x="296.5" y="282.6426"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157" x="306.5" y="304.2441">Create an Ada library crate</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="285" x="242.5" y="340.0195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265" x="252.5" y="361.6211">Create an external CMake project to integrate</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236" x="252.5" y="375.7539">the Ada library crate into te zephyr build</text><path d="M527.5,398.2852 L527.5,422.251 L507.5,426.251 L527.5,430.251 L527.5,454.2168 A0,0 0 0 0 527.5,454.2168 L1215.5,454.2168 A0,0 0 0 0 1215.5,454.2168 L1215.5,408.2852 L1205.5,398.2852 L527.5,398.2852 A0,0 0 0 0 527.5,398.2852 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1205.5,398.2852 L1205.5,408.2852 L1215.5,408.2852 L1205.5,398.2852 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="473" x="533.5" y="415.8535">- Get CFLAGS from Zephyr build for the target board (buidl zephyr with -v):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="616" x="533.5" y="431.1641">- $ZEPHYR_GCC $CFLAGS -c -fdump-ada-spec -C ${ZEPHYR_BASE_DIR}/include/zephyr/kernel.h</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="667" x="533.5" y="446.4746">- $ZEPHYR_GCC $CFLAGS -c -fdump-ada-spec -C ${ZEPHYR_BASE_DIR}/include/zephyr/posix/pthread.h</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="245" x="262.5" y="409.1846"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="225" x="272.5" y="430.7861">Generate Ada bindings for Zephyr APIs</text><path d="M615.5,470.9727 L615.5,487.2832 L595.5,491.2832 L615.5,495.2832 L615.5,511.5938 A0,0 0 0 0 615.5,511.5938 L971.5,511.5938 A0,0 0 0 0 971.5,511.5938 L971.5,480.9727 L961.5,470.9727 L615.5,470.9727 A0,0 0 0 0 615.5,470.9727 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M961.5,470.9727 L961.5,480.9727 L971.5,480.9727 L961.5,470.9727 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335" x="621.5" y="488.541">Necessary when writing Zephyr device drivers in Ada,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="621.5" y="503.8516">to access device tree nodes</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="421" x="174.5" y="474.2168"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="401" x="184.5" y="495.8184">Write C wrapper functions for Zephyr C macros to be called from Ada</text><path d="M451,521.5938 L451,545.5596 L431,549.5596 L451,553.5596 L451,577.5254 A0,0 0 0 0 451,577.5254 L769,577.5254 A0,0 0 0 0 769,577.5254 L769,531.5938 L759,521.5938 L451,521.5938 A0,0 0 0 0 451,521.5938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M759,521.5938 L759,531.5938 L769,531.5938 L759,521.5938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64" x="457" y="539.1621">Examples:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297" x="457" y="554.4727">- west -v build -p always -b esp32c3_devkitm</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218" x="457" y="569.7832">- west -v build -p always -b rpi_5</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="92" x="339" y="532.4932"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="72" x="349" y="554.0947">Build zephyr</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="345" x="212.5" y="597.5254"/><text fill="#000000" font-family="sans-serif" font-size="12" length