name = "ada_protected_demo"
description = "Zephyr Ada protected objects demo: synchronization with Ada"
version = "0.1.0-dev"

authors = ["J. German Rivera"]
maintainers = ["J. German Rivera <jgrivera67@gmail.com>"]
maintainers-logins = ["jgrivera67"]
licenses = "Apache-2.0"
website = ""
tags = []

[[depends-on]]
zephyr_ada_rts = "*"
# Architecture-specific toolchain (gnat_riscv64_elf, gnat_arm_elf, or gnat_xtensa_esp32_elf)
# is added dynamically by CMakeLists.txt using 'alr with' based on Zephyr's target architecture.
#
# For unsupported architectures (ARM64, x86), provide a custom toolchain:
#   cmake -DADA_TOOLCHAIN_PATH=/path/to/gnat-aarch64-elf ...
# or:
#   export ADA_TOOLCHAIN_PATH=/path/to/gnat-aarch64-elf
#   west build -b frdm_kl25z apps/samples/ada_protected_objects
gnatprove = "*"
gprbuild = "*" # needed by alire-index CI builds

[[pins]]
zephyr_ada_rts = { path='../../zephyr_ada_rts' }

[build-profiles]
zephyr_ada_rts = "development"

[[depends-on]]
gnat_arm_elf = "^15.2.1"
