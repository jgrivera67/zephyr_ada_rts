#
# FRDM-KL25Z Autonomous Car - Zephyr config
# Target: NXP KL25Z (ARM Cortex-M0+, 16 KB SRAM, 128 KB flash)
#
# Minimal config — keep RAM usage low.  The full feature set from the
# baremetal version (logging, shell, coredump, stats) does not fit.

CONFIG_PRINTK=y
CONFIG_ASSERT=y

# Console (UART0 on FRDM-KL25Z)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Ada tasking support
CONFIG_ADA=y

# Dynamic threads needed by GNARL (Ada tasks created at run time)
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=4

# Cooperative + preemptive priorities for GNARL priority mapping
CONFIG_NUM_PREEMPT_PRIORITIES=32

# Thread custom data used by GNARL to store Ada task control block pointer
CONFIG_THREAD_CUSTOM_DATA=y
